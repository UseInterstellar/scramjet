name: CI

# Build, test and (manually) publish @useinterstellar/scramjet.
# Publishing only happens from a manual run on v1.1.0-patched with "publish" ticked, and it publishes the exact
# tarball that this same run built and tested.

on:
  push:
    branches: [v1.1.0-patched]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the tested package to npm (only honoured on v1.1.0-patched)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # The wasm is always built from scratch on a fresh runner: no build cache, so the tarball can never carry a
      # stale or unoptimized rewriter. build.sh exits if any of these tools is missing.
      - name: Install wasm-bindgen 0.2.100
        uses: jetli/wasm-bindgen-action@v0.2.0
        with:
          version: "0.2.100"

      - name: Install binaryen (wasm-opt)
        uses: Aandreba/setup-binaryen@v1.0.0
        with:
          token: ${{ github.token }}

      - name: Install wasm-snip
        run: cargo install --locked --git https://github.com/r58playz/wasm-snip --rev e9c9e133

      - name: Show toolchain
        run: |
          wasm-bindgen --version
          wasm-opt --version
          command -v wasm-snip
          cd rewriter && rustc --version

      # prepack runs `RELEASE=1 rewriter:build` (cargo -> wasm-bindgen -> wasm-snip -> wasm-opt) and build:all
      - name: Pack
        id: pack
        run: |
          pnpm pack
          tgz=$(ls useinterstellar-scramjet-*.tgz)
          echo "sha256=$(sha256sum "$tgz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Show package contents
        run: |
          tar -tzvf useinterstellar-scramjet-*.tgz | grep -v dist/types/
          sha256sum useinterstellar-scramjet-*.tgz dist/scramjet.wasm.wasm

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: useinterstellar-scramjet-*.tgz
          if-no-files-found: error

  validate:
    name: Validate packed artifact
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: package
          path: .

      - name: Check the artifact is the one that was built
        run: echo "${{ needs.build.outputs.sha256 }}  $(ls useinterstellar-scramjet-*.tgz)" | sha256sum -c -

      # replace dist/ and lib/ with the tarball's contents so the tests look at what would be published
      - name: Extract package
        run: |
          rm -rf dist lib
          tar xzf useinterstellar-scramjet-*.tgz package --strip-components=1

      - run: pnpm test:package

      - run: pnpm exec ava tests/ci/frameAncestors.js

  rewriter-tests:
    name: Rewriter tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: cd rewriter/native && cargo test

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [build, validate, rewriter-tests]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/v1.1.0-patched' }}

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v4
        with:
          name: package
          path: .

      - name: Check the artifact is the one that was tested
        run: echo "${{ needs.build.outputs.sha256 }}  $(ls useinterstellar-scramjet-*.tgz)" | sha256sum -c -

      - name: Publish
        run: npm publish useinterstellar-scramjet-*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
